[pytest]
# Strict markers: every marker must be registered (see pg_gate_plugin's
# pytest_configure, which registers `pg_gate`). An unregistered marker is a
# collection error rather than a silently-ignored typo.
addopts = --strict-markers
markers =
    release_seal: attaches a REAL read-only disk image to prove the OS boundary
        (g-release-os-boundary). ~5 minutes and ~900MB, and the sealed bytes are compared
        against live host trees that other agents are editing, so `.githooks/pre-push`
        deselects these with `-m "not release_seal"`. Run them on demand — and before
        approving a release: `pytest -c backend/pytest.ini backend -m release_seal`.
