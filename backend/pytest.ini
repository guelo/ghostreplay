[pytest]
# Strict markers: every marker must be registered (see pg_gate_plugin's
# pytest_configure, which registers `pg_gate`). An unregistered marker is a
# collection error rather than a silently-ignored typo.
addopts = --strict-markers
markers =
    release_seal: release-only host integration and production-shape performance gates.
        These attach a REAL read-only disk image (g-release-os-boundary) or use a
        disposable PostgreSQL 18 copy of the restored production dump
        (g-delta-priority-lane). They take minutes and read host state other agents
        may be editing, so `.githooks/pre-push` deselects them with
        `-m "not release_seal"`. Run the relevant documented command when validating
        its feature and run the full marker before release:
        `pytest -c backend/pytest.ini backend -m release_seal`.
