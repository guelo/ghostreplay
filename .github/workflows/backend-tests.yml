name: backend-tests

on:
  workflow_dispatch:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          # Creates the database both URLs below reference; without it every
          # connection targets a nonexistent DB and all steps fail.
          POSTGRES_DB: ghostreplay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ghostreplay_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # DATABASE_URL drives Alembic (backend/alembic/env.py); GHOSTREPLAY_TEST_PG_URL
      # drives the pytest pg_* fixtures. Both must point at the same DB.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ghostreplay_test
      GHOSTREPLAY_TEST_PG_URL: postgresql://postgres:postgres@localhost:5432/ghostreplay_test
      # Maintenance URL for pg_migration_db: authority to CREATE/DROP the
      # disposable ghostreplay_mig_test_* databases migration tests build from
      # base. Points at the always-present `postgres` maintenance DB, never the
      # shared test DB. Without it the disposable-DB migration tests SKIP.
      GHOSTREPLAY_TEST_PG_MAINT_URL: postgresql://postgres:postgres@localhost:5432/postgres
    defaults:
      run:
        # alembic.ini lives in backend/, so all migration/test commands run here.
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      # Validate the migration's PostgreSQL dialect branch (partial unique index +
      # BigInteger), which Base.metadata.create_all does not exercise. up/down/up.
      - name: Alembic upgrade head
        run: alembic upgrade head
      - name: Alembic downgrade -1
        run: alembic downgrade -1
      - name: Alembic re-upgrade head
        run: alembic upgrade head
      # Required PostgreSQL release gate (g-release-integrate). With required mode
      # ON, a missing URL — or ANY residual skip/xfail on a @pg_gate test — FAILS
      # instead of quietly passing, the empty-selection guard trips if nothing is
      # gated, and the fixed REQUIRED_PG_GATE_TESTS / REQUIRED_PG_GATE_PARAM_CASES
      # manifests fail collection if a required migration/concurrency invariant is
      # deleted, renamed, or left unmarked. This is the canonical gate command and
      # is what actually activates the guards the plugin defines; the plain
      # `pytest -v` below runs with the guards dormant (URL set, required mode off).
      - name: Run required PostgreSQL gate
        env:
          GHOSTREPLAY_REQUIRE_PG_TESTS: '1'
        run: pytest -m pg_gate --strict-markers -rs
      # Staleness guard for the drill-routing transposition overlay
      # (public/data/openings/eco.transpositions.json). Recomputes the canonical
      # edge set from the current graph and diffs it EXACTLY against the
      # checked-in artifact. This is the real guard: the artifact's
      # graph_topology_fingerprint proves which graph it came from, NOT that it
      # holds every edge that graph generates — a truncated or hand-edited
      # artifact keeps a valid fingerprint and passes every per-edge check. Only
      # set equality catches that, and only before deploy: at runtime a bad
      # artifact degrades silently to no densification rather than taking the
      # app down over a routing feature.
      - name: Check transposition overlay is current
        run: python scripts/densify_opening_graph.py --check
      # Full suite. @pg_gate tests still run (not skip) here because
      # GHOSTREPLAY_TEST_PG_URL is set; the dedicated gate step above is what
      # enforces required-mode fail-closed behaviour.
      - name: Run tests
        run: pytest -v
