name: backend-tests

on:
  workflow_dispatch:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          # Creates the database both URLs below reference; without it every
          # connection targets a nonexistent DB and all steps fail.
          POSTGRES_DB: ghostreplay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ghostreplay_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # DATABASE_URL drives Alembic (backend/alembic/env.py); GHOSTREPLAY_TEST_PG_URL
      # drives the pytest pg_* fixtures. Both must point at the same DB.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ghostreplay_test
      GHOSTREPLAY_TEST_PG_URL: postgresql://postgres:postgres@localhost:5432/ghostreplay_test
      # Maintenance URL for pg_migration_db: authority to CREATE/DROP the
      # disposable ghostreplay_mig_test_* databases migration tests build from
      # base. Points at the always-present `postgres` maintenance DB, never the
      # shared test DB. Without it the disposable-DB migration tests SKIP.
      GHOSTREPLAY_TEST_PG_MAINT_URL: postgresql://postgres:postgres@localhost:5432/postgres
    defaults:
      run:
        # alembic.ini lives in backend/, so all migration/test commands run here.
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          # Only this job's files. setup-python's cache key has no job in it,
          # so the maia3-engine job (which also hashes the maia3 files) gets a
          # different key and neither job restores the other's cache.
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            backend/requirements.production.constraints.txt
      # Install the runtime closure at the versions Railway installs. Without -c
      # this resolves whatever is newest on the day the job runs, which is not
      # what production serves (g-test-deps-pinning: SQLAlchemy 2.1 and
      # Starlette 1.10 instead of the pinned 2.0.54 and 1.7.0).
      # test_dependency_pins.py fails the suite if the pins and the venv diverge.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt -c requirements.production.constraints.txt
      # Validate the migration's PostgreSQL dialect branch (partial unique index +
      # BigInteger), which Base.metadata.create_all does not exercise. up/down/up.
      - name: Alembic upgrade head
        run: alembic upgrade head
      - name: Alembic downgrade -1
        run: alembic downgrade -1
      - name: Alembic re-upgrade head
        run: alembic upgrade head
      # Required PostgreSQL release gate (g-release-integrate). With required mode
      # ON, a missing URL — or ANY residual skip/xfail on a @pg_gate test — FAILS
      # instead of quietly passing, the empty-selection guard trips if nothing is
      # gated, and the fixed REQUIRED_PG_GATE_TESTS / REQUIRED_PG_GATE_PARAM_CASES
      # manifests fail collection if a required migration/concurrency invariant is
      # deleted, renamed, or left unmarked. This is the canonical gate command and
      # is what actually activates the guards the plugin defines; the plain
      # `pytest -v` below runs with the guards dormant (URL set, required mode off).
      # Both steps select @pg_gate tests (and the full run also selects the legacy
      # shared-PG fixtures), so they hold the plugin's database-scoped schema lease
      # for their complete test phase. Another process pointed at this URL reports
      # the holder while it waits instead of racing Alembic, per-test TRUNCATEs, or
      # legacy writes; genuinely SQLite-only selections take no lock.
      - name: Run required PostgreSQL gate
        env:
          GHOSTREPLAY_REQUIRE_PG_TESTS: '1'
        run: pytest -m pg_gate --strict-markers -rs
      # Staleness guard for the drill-routing transposition overlay
      # (public/data/openings/eco.transpositions.json). Recomputes the canonical
      # edge set from the current graph and diffs it EXACTLY against the
      # checked-in artifact. This is the real guard: the artifact's
      # graph_topology_fingerprint proves which graph it came from, NOT that it
      # holds every edge that graph generates — a truncated or hand-edited
      # artifact keeps a valid fingerprint and passes every per-edge check. Only
      # set equality catches that, and only before deploy: at runtime a bad
      # artifact degrades silently to no densification rather than taking the
      # app down over a routing feature.
      - name: Check transposition overlay is current
        run: python scripts/densify_opening_graph.py --check
      # Full suite. @pg_gate tests still run (not skip) here because
      # GHOSTREPLAY_TEST_PG_URL is set; the dedicated gate step above is what
      # enforces required-mode fail-closed behaviour.
      - name: Run tests
        run: pytest -v

  # The real Maia3 engine on Linux (g-maia3-real-engine): torch, the pinned
  # weights and the engine wrapper, which the job above only tests against fake
  # engines. Production does not install or run the engine yet.
  maia3-engine:
    runs-on: ubuntu-latest
    env:
      # The smoke and its fail-the-build exit status only run when enabled.
      MAIA3_ENABLED: '1'
      # Fail closed: a missing maia3 install or missing weights fails the pin
      # and release tests instead of skipping them, so this job cannot go green
      # without running the engine.
      GHOSTREPLAY_REQUIRE_MAIA3_TESTS: '1'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      # Keyed on the pins: a new revision or model re-downloads, and
      # prepare_maia3_engine.py verifies size and sha256 of whatever is restored.
      - name: Cache Maia3 weights
        uses: actions/cache@v4
        with:
          path: backend/maia3_weights
          key: maia3-weights-${{ hashFiles('backend/app/maia3_pins.py') }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt -r requirements-maia3.txt -c requirements.production.constraints.txt
          pip check
      # On Linux the Maia3 pins must equal what requirements-maia3.txt installs.
      - name: Check dependency pins
        run: python -W error -m pytest -c pytest.ini test_dependency_pins.py -rs
      # Fetch and verify the weights, then start the real engine, play one move
      # and stop it. Prints "maia3 smoke ok ... child_hwm_kb=..." (native Linux
      # peak memory of the engine child). --require-smoke exits 1 if
      # MAIA3_ENABLED=1 is ever dropped, instead of skipping the smoke.
      - name: Prepare and smoke-test the engine
        run: python scripts/prepare_maia3_engine.py --require-smoke
      - name: Engine release test
        run: python -W error -m pytest -c pytest.ini -m release_seal test_maia3_engine_release.py -v -rs
