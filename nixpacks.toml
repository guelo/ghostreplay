providers = ["python"]

[variables]
NIXPACKS_PYTHON_VERSION = "3.12.7"
NIXPACKS_PYTHON_PACKAGE_MANAGER = "requirements"

[phases.install]
cmds = [
  "/opt/venv/bin/python -m ensurepip --upgrade",
  "if [ -f backend/requirements.txt ]; then requirements=backend/requirements.txt; else requirements=requirements.txt; fi; /opt/venv/bin/python -m pip install -r \"$requirements\"",
]

[phases.build]
cmds = [
  # Nixpacks Python provider treats backend/ as project root, dropping repo-root
  # siblings; copy opening data into backend/ so it lands at /app/public/.
  "if [ -d backend ]; then if [ ! -d public/data/openings ]; then echo \"ERROR: backend/ deploy but public/data/openings missing\" >&2; exit 1; fi; mkdir -p backend/public/data/openings && cp -R public/data/openings/. backend/public/data/openings/; fi",
]

[start]
cmd = "if [ -d backend ]; then cd backend; fi; /opt/venv/bin/python -m alembic upgrade head && /opt/venv/bin/python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT"
