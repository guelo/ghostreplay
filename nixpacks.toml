providers = ["python"]

[variables]
NIXPACKS_PYTHON_VERSION = "3.12.7"
NIXPACKS_PYTHON_PACKAGE_MANAGER = "requirements"

[phases.install]
cmds = [
  "/opt/venv/bin/python -m ensurepip --upgrade",
  "/opt/venv/bin/python -m pip install -r backend/requirements.txt",
]

[phases.build]
cmds = ["true"]

[start]
cmd = "cd backend && /opt/venv/bin/python -m alembic upgrade head && /opt/venv/bin/python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT"
